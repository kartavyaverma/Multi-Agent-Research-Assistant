[project]
name = "multi-agent-research-assistant"
version = "1.0.0"
description = "Multi-agent research pipeline (LangGraph + FastAPI + Langfuse + Ragas)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    "langchain==0.3.14",
    "langchain-openai==0.2.14",
    "langgraph==0.2.60",
    "langchain-community==0.3.14",
    "langfuse==2.57.0",
    "ragas==0.2.10",
    "datasets==3.2.0",
    "tavily-python>=0.7.26",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
]

[tool.uv]
package = false
